<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research Guide</title><style>
:root{--top:#dff3ff;--mid:#b9e5fb;--bottom:#5d9ed0;--purple:#d9c7f4;--text:#18324a}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--text);background:linear-gradient(180deg,var(--top),var(--mid) 45%,var(--bottom));min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:28px 18px 50px}.title{text-align:center;font-size:clamp(2.3rem,5vw,3.8rem);font-weight:850;color:#254e70;margin:10px 0 18px}.bar{max-width:760px;margin:0 auto 18px;padding:12px;text-align:center;border-radius:12px;background:linear-gradient(90deg,#e7dafa,var(--purple),#e7dafa);border:1px solid #bda1e2;color:#5c4779;font-weight:700}.panel,.card,.answer{background:#ffffffdd;border:1px solid #4b89b133;border-radius:16px;padding:16px;box-shadow:0 10px 28px #295b7b1a}.search{display:flex;gap:10px}.search input{flex:1;padding:15px;border:1px solid #4a89b34d;border-radius:12px;font-size:16px}.btn{border:0;border-radius:12px;padding:0 24px;background:linear-gradient(135deg,#8d76b4,#765a9f);color:white;font-weight:800;cursor:pointer}.tabs{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.tab{border:0;background:#ffffffaa;padding:11px 16px;border-radius:10px;cursor:pointer;font-weight:700}.tab.active{background:#8064a8;color:#fff}.hidden{display:none}.card{margin:10px 0}.muted{color:#58718a;font-size:13px}.answer{line-height:1.6}.warn{border-left:4px solid #d99045;padding:10px;background:#fff4e6;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.grid img{width:100%;border-radius:10px}.filters{margin-top:12px}.filters summary{cursor:pointer;font-weight:700}.filters-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.filters input,.filters select{width:100%;padding:10px;border-radius:9px;border:1px solid #4a89b34d}@media(max-width:700px){.search{flex-direction:column}.btn{height:48px}.filters-grid,.grid{grid-template-columns:1fr 1fr}}
</style></head><body><main class="wrap"><div class="title">Research Guide</div><div class="bar">Simple Research · Search · Sources · Understanding</div><section class="panel"><div class="search"><input id="q" placeholder="Search Research Guide"><button class="btn" onclick="runSearch()">SEARCH</button></div><details class="filters"><summary>FILTERS</summary><div class="filters-grid"><input id="author" placeholder="Author"><input id="publisher" placeholder="Publisher"><input id="journal" placeholder="Journal / venue"><input id="location" placeholder="Location"><select id="language"><option>Any language</option><option>English</option><option>Urdu</option><option>Arabic</option><option>Chinese</option><option>Spanish</option><option>French</option><option>German</option></select><select id="database"><option>Any database</option><option>Google Scholar</option><option>IEEE Xplore</option><option>PubMed</option><option>Crossref</option><option>arXiv</option><option>Semantic Scholar</option><option>DOAJ</option><option>JSTOR</option><option>ScienceDirect</option><option>SpringerLink</option><option>Wiley</option><option>ACM Digital Library</option></select></div></details></section><div id="status"></div><div id="tabs" class="tabs hidden"><button class="tab active" onclick="showTab('web',this)">WEB</button><button class="tab" onclick="showTab('results',this)">RESULTS</button><button class="tab" onclick="showTab('news',this)">NEWS</button><button class="tab" onclick="showTab('images',this)">IMAGES</button></div><section id="web"></section><section id="results" class="hidden"></section><section id="news" class="hidden"></section><section id="images" class="hidden"></section></main><script>
let lastQuery='';function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function showTab(id,b){['web','results','news','images'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id==='news')loadNews();if(id==='images')loadImages()}async function runSearch(){const q=document.getElementById('q').value.trim();if(!q)return;lastQuery=q;document.getElementById('status').innerHTML='<p>Searching and reading sources...</p>';const filters={author:document.getElementById('author').value,publisher:document.getElementById('publisher').value,journal:document.getElementById('journal').value,location:document.getElementById('location').value,language:document.getElementById('language').value,database:document.getElementById('database').value};const r=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,filters})});const d=await r.json();if(!r.ok){document.getElementById('status').innerHTML='<p>'+esc(d.error)+'</p>';return}document.getElementById('tabs').classList.remove('hidden');document.getElementById('status').innerHTML='';document.getElementById('web').innerHTML=d.results.map((x,i)=>`<div class="card"><b>${String(i+1).padStart(2,'0')} · ${esc(x.title)}</b><div class="muted">${x.url?esc((()=>{try{return new URL(x.url).hostname}catch(e){return ''}})()):''}</div><p>${esc(x.snippet)}</p><a href="${esc(x.url)}" target="_blank" rel="noopener">↗ Open source</a></div>`).join('');let a=d.analysis;document.getElementById('results').innerHTML=`<h2>Research Guide Answer</h2><div class="answer">${esc(a.answer)}</div><h2>Facts / Evidence</h2>${(a.facts||[]).map(x=>`<p>• ${esc(x)}</p>`).join('')||'<p>No explicit fact/evidence statements were automatically identified.</p>'}${(a.warnings||[]).length?'<h2>Myths / Warnings</h2>'+a.warnings.map(x=>`<div class="warn">${esc(x)}</div>`).join(''):''}`;showTab('results',document.querySelectorAll('.tab')[1])}async function loadNews(){const r=await fetch('/api/news',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:lastQuery})});const d=await r.json();document.getElementById('news').innerHTML=(d.items||[]).map((x,i)=>`<div class="card"><h3>${i+1}. ${esc(x.title)}</h3><div class="muted">${esc(x.source||'')} ${esc(x.date||'')}</div><p>${esc(x.body||'')}</p>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">🔗 Read article</a>`:''}</div>`).join('')}async function loadImages(){const r=await fetch('/api/images',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:lastQuery})});const d=await r.json();document.getElementById('images').innerHTML='<div class="grid">'+(d.items||[]).map(x=>{let u=x.thumbnail||x.image;return u?`<img src="${esc(u)}" alt="${esc(x.title||'Image')}">`:''}).join('')+'</div>'}document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')runSearch()});
</script></body></html>
